     (o branco do clipe some no fundo, como nos outros vídeos). Por isso: Maranhão em azul claro e fecho sem painel azul.
     v2 = devolutiva dos quadros da v1 (20/11/2026): tela toda ocupada (o vídeo também vai por WhatsApp, sem margem);

<script>
const $ = (id) => document.getElementById(id);
const P = TS.p, V = TS.v;
const vis = (el, on) => { TS.mostra(el, on); return on; };
// busca com limite de tempo: se o navegador não avisar que o vídeo chegou no quadro, segue em 2 s (evita render travado)
const busca1 = (v, tt) => Promise.race([TS.busca(v, tt), new Promise((r) => setTimeout(r, 2000))]);
const mix = (a, b, k) => a + (b - a) * k;
const INTRO = 20.45;                 // início do logo animado (narração termina em 20,40 s)
window.DURACAO = INTRO + 4.395;      // 24,85 s
const CX = 480;                      // centro da área segura (x 65–888): texto e informação importante
const BASE = 1752;                   // pé das pessoas: logo acima da régua (WhatsApp mostra a tela toda)

// ---------- mapa ----------
const NS = 'http://www.w3.org/2000/svg';
MAPA.paths.forEach(({ id, d }) => { const p = document.createElementNS(NS, 'path'); p.setAttribute('d', d); p.id = 'm-' + id;
  p.setAttribute('stroke', '#fff'); p.setAttribute('stroke-linejoin', 'round'); $('mapa-g').appendChild(p); });
const MA = $('m-BR-MA').getBBox();
const MAc = [MA.x + MA.width / 2, MA.y + MA.height / 2];

// ---------- pessoas: caixa do personagem no quadro 1920×1080 do clipe (x0, y0, w, h) ----------
const PES = { idosa: { x0: 778, y0: 88, w: 361, h: 930, t0: 5.62 }, agricultor: { x0: 786, y0: 100, w: 420, h: 924, t0: 6.30 }, estudante: { x0: 805, y0: 149, w: 291, h: 863, t0: 6.95 } };
// tempo do clipe: o gesto toca uma vez; depois vaivém suave na parte calma (2,25–3,85 s), sem salto
const tclip = (tl) => { if (tl <= 3.85) return Math.max(0, tl); const c = (tl - 3.85) % 3.2; return c < 1.6 ? 3.85 - c : 2.25 + (c - 1.6); };
// põe o personagem com a caixa (largura w) a partir de (left, top), escala sc
// quadros do clipe original (JPG com o fundo branco do Flow, sem recorte): caixa do personagem + margem de 40 px
const MARG = 40, pad3 = (i) => String(i).padStart(3, '0');
async function quadroPes(n, tc) {
  const el = $('v-' + n), src = `../camadas/quadros_orig/${n}/${pad3(Math.min(117, Math.max(0, Math.round(tc * 30))))}.jpg`;
  if (el._src === src) return; el._src = src; el.src = src; try { await el.decode(); } catch (e) {}
}
const poePessoa = (n, left, top, sc, op, blur) => { const el = $('v-' + n);
  el.style.transform = `translate(${left - MARG * sc}px, ${top - MARG * sc}px) scale(${sc})`;
  el.style.opacity = op; el.style.filter = blur > 0.05 ? `blur(${blur}px)` : 'none'; };
const NOMES = ['idosa', 'agricultor', 'estudante'];

// ---------- cartão: [cx, cy, w, h, raio, ícone, título, azul] ----------
const TITULO = [CX, 760, 600, 230, 46, 140, 80, 1];
const CABEC = [CX, 350, 300, 124, 32, 84, 56, 1];
const FINAL = [CX, 540, 600, 250, 52, 150, 82, 1];
function poeCard(c, linhas) {
  let [cx, cy, w, h, r, ic, ft, azul] = c; const el = $('card'), tt = $('card-tit');
  tt.style.fontSize = `${Math.max(1, ft)}px`;
  const pd = Math.max(18, (h - ic) / 2);
  if (ft > 20) w = Math.max(w, pd + ic + 0.18 * ft + 10 + tt.offsetWidth + pd + 6);   // nunca corta o título
  Object.assign(el.style, { left: `${cx - w / 2}px`, top: `${cy - h / 2}px`, width: `${w}px`, height: `${h}px`, borderRadius: `${r}px` });
  el.style.background = `rgb(${mix(255, 54, azul)},${mix(255, 93, azul)},${mix(255, 204, azul)})`;
  Object.assign($('card-ic').style, { width: `${ic}px`, height: `${ic}px`, marginLeft: `${pd}px`, background: azul > .5 ? 'rgba(255,255,255,.95)' : '#FDECEC' });
  $('card-linhas').style.marginLeft = '22px'; $('card-linhas').style.opacity = linhas;
  tt.style.color = azul > .5 ? '#fff' : '#1C306A';
  tt.style.left = `${pd + ic + 0.18 * ft + 10}px`; tt.style.top = `${h / 2}px`; tt.style.transform = 'translateY(-54%)';
  return { cx, cy, w, h, ic, pd };
}
const mixC = (a, b, k) => a.map((v, i) => mix(v, b[i], k));

const FEED_T = [9.55, 10.85, 12.15, 13.20, 14.62, 15.85];
const ITENS_T = [12.20, 13.24, 14.68];

window.render = async (t) => {
  const busca = [];
  document.documentElement.style.setProperty('--dx', `${(t * 9) % 48}px`);
  document.documentElement.style.setProperty('--dy', `${(t * 5) % 48}px`);
  [[$('b1'), 120, 260, 0.21, 0], [$('b2'), 640, 1040, 0.17, 2], [$('b3'), 320, 1460, 0.13, 4]].forEach(([el, x, y, f, ph]) => {
    el.style.left = `${x - 450 + 120 * Math.sin(f * t + ph)}px`; el.style.top = `${y - 450 + 90 * Math.cos(f * 0.8 * t + ph)}px`; });
  let ondas = '';

  // ===== MAPA (0–16,6 s): marca d'água com deriva lateral e zoom contínuos; C2 aproxima no Maranhão =====
  {
    const kZ = P(t, 5.35, 1.4, 'mola'), kAz = P(t, 5.8, 0.6, 'inOut');
    const kV = P(t, 8.7, 1.2, 'inOut');                                       // volta a ser marca d'água em C3
    const deriva = 70 * Math.sin(0.33 * t), sobe = 40 * Math.cos(0.21 * t);
    // marca d'água: Brasil grande (≈ 1700 px), Maranhão perto do centro alto, zoom lento sempre crescendo
    const sW = 2.75 * (1 + 0.012 * t), oW = [MAc[0] + 40, MAc[1] + 80], pW = [CX + 60 + deriva, 820 + sobe];
    // C2: Maranhão com ~1150 px de largura, atrás das pessoas
    const sZ = 640 / MA.width * (1 + 0.02 * Math.max(0, t - 5.35)), oZ = MAc, pZ = [CX + 40 + deriva * 0.3, 640];   // acima das pessoas: o multiplicar não deixa o mapa passar pelo corpo
    const k = kZ * (1 - kV);
    const s = mix(sW, sZ, k), ox = mix(oW[0], oZ[0], k), oy = mix(oW[1], oZ[1], k), px = mix(pW[0], pZ[0], k) - 260 * kV, py = mix(pW[1], pZ[1], k);
    $('mapa-g').setAttribute('transform', `translate(${px} ${py}) scale(${s}) translate(${-ox} ${-oy})`);
    const acende = kAz * (1 - kV);
    MAPA.paths.forEach(({ id }) => { const el = $('m-' + id);
      el.setAttribute('stroke-width', (2.2 / s).toFixed(3));
      if (id === 'BR-MA') { el.setAttribute('fill', `rgba(54,93,204,${mix(0.13, 0.26, acende)})`);
        el.setAttribute('stroke', acende > 0.01 ? `rgba(54,93,204,${0.9 * acende})` : '#fff'); el.setAttribute('stroke-width', ((2.2 + 3.5 * acende) / s).toFixed(3)); return; }
      else el.setAttribute('fill', `rgba(54,93,204,${mix(0.055, 0.08, acende)})`); });
    $('mapa').style.opacity = Math.min(1, t / 0.4) * (1 - P(t, INTRO - 0.2, 0.4));
    // com as pessoas em cena, o mapa some na faixa delas (o multiplicar mostraria o mapa através do corpo)
    const kPes = Math.max(P(t, 5.3, 0.4) * (1 - P(t, 9.0, 0.4)), P(t, 16.55, 0.4));
    const yCorte = mix(760, 720, P(t, 16.55, 0.4));
    const mk = kPes > 0 ? `linear-gradient(to bottom, #000 0px, #000 ${yCorte}px, rgba(0,0,0,${1 - kPes}) ${yCorte + 170}px)` : 'none';
    $('mapa').style.webkitMaskImage = mk; $('mapa').style.maskImage = mk;
  }

  // ===== CELULAR =====
  const fone = $('fone');
  const kIn = P(t, 0.0, 0.9, 'mola'), kSai1 = P(t, 3.0, 0.55, 'inOut');
  const kVolta = P(t, 8.8, 0.9, 'mola'), kLado = P(t, ITENS_T[0] - 0.2, 0.85, 'mola');
  const flut = 14 * Math.sin(1.1 * t), gira = 2.2 * Math.sin(0.7 * t + 0.6);     // flutua e balança sempre (movimento contínuo)
  let fx, fy, fs, fo, fb = 0;
  if (t < 8.8) {
    // com o título, o celular desce e fica embaixo (a tela não esvazia); sai por baixo quando as pessoas entram
    const kBaixo = P(t, 5.45, 0.55, 'inOut');
    fx = CX + 20; fy = 1100 + 360 * (1 - kIn) + flut + 520 * kSai1 + 900 * kBaixo; fs = 1.55 * (0.92 + 0.08 * kIn) * (1 - 0.12 * kSai1);
    fo = Math.min(1, t / 0.25); fb = 3 * kSai1;
  } else {
    fx = mix(CX + 1200, CX + 30, kVolta); fy = 1130 + flut; fs = 1.5 + 0.03 * Math.sin(0.5 * t); fo = 1;
    fx = mix(fx, 270, kLado); fs = mix(fs, 1.42, kLado);
  }
  fone.style.transform = `translate(${fx - 200}px, ${fy - 360}px) rotate(${gira}deg) scale(${fs})`;
  fone.style.opacity = fo; fone.style.filter = fb ? `blur(${fb}px)` : 'none';
  vis(fone, fo > 0.01 && t < 17.2);
  $('feed').style.display = t >= 8.8 ? '' : 'none'; $('acoes').style.opacity = t >= 8.8 ? 0.85 : 0;

  // ===== C1 · gancho =====
  const kTxtSai = P(t, 2.95, 0.45, 'inOut');
  TS.entra($('c1-a'), t, 0.86, { d: 0.5 }); TS.entra($('c1-b'), t, 1.95, { d: 0.5 });
  $('c1-txt').style.transform = `translateY(${-170 * kTxtSai}px)`; $('c1-txt').style.opacity = 1 - kTxtSai;
  vis($('c1-txt'), t < 3.5);

  // ===== CARTÃO: notificação → título → cabeçalho → cartão final =====
  const kN = P(t, 0.80, 0.7, 'mola'), kT = P(t, 3.05, 0.95, 'mola'), kC = P(t, 5.30, 0.9, 'mola'), kF = P(t, 16.62, 1.0, 'mola');
  // a notificação fica presa à tela do celular (acompanha a flutuação e o recuo)
  const nW = 300 * fs, nH = 104 * fs;
  let c = [fx, fy - 360 * fs + 130 * fs, nW, nH, 24 * fs / 1.12, 64 * fs, 0, 0];
  c = mixC(c, TITULO, kT); c = mixC(c, CABEC, kC); c = mixC(c, FINAL, kF);
  const cb = poeCard(c, 1 - P(t, 3.05, 0.35));
  const flC = kF > 0 ? 8 * Math.sin(1.3 * t) * kF : 0;                               // o cartão final respira
  $('card').style.opacity = Math.min(1, P(t, 0.80, 0.25));
  $('card').style.transform = `translateY(${-70 * (1 - kN) + flC}px) rotate(${t < 3.05 ? gira * (1 - kT) : 0}deg) scale(${0.85 + 0.15 * kN})`;
  const kTit = P(t, 3.62, 0.45);
  $('card-tit').style.opacity = kTit; $('card-tit').style.filter = `blur(${8 * (1 - kTit)}px)`;
  const bat = (t0) => Math.max(0, Math.sin(Math.PI * Math.min(1, Math.max(0, (t - t0) / 0.32))));
  const bs = 1 + 0.16 * bat(0.95) + 0.12 * bat(3.88) + 0.12 * bat(17.0) + 0.14 * bat(18.16) + 0.14 * bat(19.64);
  $('card-ic').querySelector('svg').style.transform = `scale(${bs})`;
  const icx = cb.cx - cb.w / 2 + cb.pd + cb.ic / 2, icy = cb.cy + flC;
  const onda = (t0, r0, cor, dr) => { const f = (t - t0) / 1.1; if (f > 0 && f < 1) ondas += `<circle cx="${icx}" cy="${icy}" r="${r0 + dr * f}" fill="none" stroke="${cor}" stroke-width="6" opacity="${0.55 * (1 - f)}"/>`; };
  onda(0.95, 40, '#365DCC', 420); onda(1.25, 40, '#365DCC', 420); onda(18.16, 90, '#365DCC', 700); onda(18.5, 90, '#365DCC', 700);
  vis($('card'), t < INTRO + 0.7);

  // ===== C2 · pessoas + etiquetas (5,3–9,4 s) =====
  const kArr = P(t, 8.72, 0.6, 'inOut');
  if (vis($('c2'), t >= 5.2 && t < 9.4)) {
    $('c2').style.transform = `translateX(${-1150 * kArr}px)`;
    // escala dinâmica: a primeira entra enorme; a cada nova, todas encolhem e abrem espaço. Pés junto à régua.
    const ks = NOMES.map((n) => P(t, PES[n].t0, 0.85, 'mola'));
    let esc = 1.0; esc = mix(esc, 0.92, ks[1]); esc = mix(esc, 0.86, ks[2]);
    const larg = NOMES.map((n, i) => PES[n].w * esc * ks[i]);
    const gap = -30 * esc, tot = larg.reduce((a, b) => a + b, 0) + gap * Math.max(0, ks.filter((k) => k > 0).length - 1);
    let x = CX + 40 - tot / 2;
    for (let i = 0; i < 3; i++) {
      const n = NOMES[i], k = ks[i], w = PES[n].w * esc, h = PES[n].h * esc;
      busca.push(quadroPes(n, tclip(t - PES[n].t0 + 0.15)));
      poePessoa(n, x + larg[i] / 2 - w / 2 - 1150 * kArr, BASE - h + 160 * (1 - k), esc, Math.min(1, k * 2.5), 6 * (1 - Math.min(1, k * 1.6)));
      x += larg[i] + (k > 0 ? gap : 0);
    }
    // etiquetas: entram grandes no centro; com a segunda, a primeira sobe, encolhe e inclina
    const k1 = P(t, 6.32, 0.7, 'mola'), k2 = P(t, 7.66, 0.7, 'mola');
    const e1 = $('t-consc'), e2 = $('t-cid'), w1 = e1.offsetWidth, h1 = e1.offsetHeight, w2 = e2.offsetWidth;
    const y1 = mix(640, 540, k2), s1e = mix(1.12, 0.96, k2), x1c = mix(CX, 400, k2);
    e1.style.transform = `translate(${x1c - w1 / 2}px, ${y1 - h1 / 2 + 50 * (1 - k1)}px) rotate(${-2.5 * k2}deg) scale(${s1e * (0.7 + 0.3 * k1)})`;
    e1.style.opacity = Math.min(1, k1 * 2);
    e2.style.transform = `translate(${600 - w2 / 2}px, ${680 - h1 / 2 + 50 * (1 - k2)}px) rotate(${2 * k2}deg) scale(${1.04 * (0.7 + 0.3 * k2)})`;
    e2.style.opacity = Math.min(1, k2 * 2);
  }

  // ===== C3 · feed + itens (8,8–16,7 s) =====
  if (t >= 8.8) {
    let pos = 0;
    FEED_T.forEach((ti, i) => { if (i > 0) pos += P(t, ti - 0.18, 0.36, 'inOut'); });
    $('feed').style.transform = `translateY(${-684 * pos}px)`;
    FEED_T.forEach((ti, i) => { if (Math.abs(i - pos) < 1) busca.push(busca1($('f' + i), Math.min(1.5, Math.max(0, t - (i === 0 ? 8.85 : ti - 0.2))))); });
  }
  if (vis($('c3-a'), t >= 9.0 && t < 17.2)) {
    TS.entra($('c3-a1'), t, 9.5, { d: 0.45 }); TS.entra($('c3-a2'), t, 10.52, { d: 0.45 });
  }
  const kI = ITENS_T.map((ti) => P(t, ti - 0.12, 0.75, 'mola'));
  const nI = kI.reduce((a, b) => a + b, 0);
  for (let i = 0; i < 3; i++) {
    const el = $('i' + i), k = kI[i];
    if (!vis(el, k > 0 && t < 17.2)) continue;
    const yFinal = 1130 + (i - (Math.max(1, nI) - 1) / 2) * 250 + 6 * Math.sin(1.2 * t + i);   // centralizado na altura do celular
    const novo = 1 - (i + 1 < 3 ? kI[i + 1] : 0);
    const s = 0.94 + 0.08 * novo;
    el.style.transform = `translate(${mix(450 + 140, 450, k)}px, ${yFinal - el.offsetHeight / 2}px) scale(${s})`;
    el.style.opacity = Math.min(1, k * 2.2); el.style.filter = k < 1 ? `blur(${8 * (1 - Math.min(1, k * 1.5))}px)` : 'none';
  }

  // ===== C4 · fundo claro: o conteúdo de C3 sobe (arrasto para cima), o cabeçalho vira o cartão azul e as pessoas voltam =====
  const kP = P(t, 16.42, 0.62, 'inOut');
  vis($('painel'), false);
  if (kP > 0) {
    $('c3-a').style.transform = `translateY(${-1400 * kP}px)`;
    for (let i = 0; i < 3; i++) { const el = $('i' + i); el.style.transform = el.style.transform.replace(/translate\(([-\d.]+)px, ([-\d.]+)px\)/, (m, a, b) => `translate(${a}px, ${+b - 1500 * kP}px)`); }
    fone.style.transform = `translate(${fx - 200}px, ${fy - 360 - 1500 * kP}px) rotate(${gira}deg) scale(${fs})`;
  } else $('c3-a').style.transform = 'none';
  const pessoasC2 = t >= 5.2 && t < 9.4, pessoasC4 = t >= 16.7 && t < INTRO + 0.6;
  NOMES.forEach((n) => vis($('v-' + n), pessoasC2 || pessoasC4));
  if (pessoasC4) {
    const T4 = [16.85, 17.05, 17.25], esc = 0.98;
    const ws = NOMES.map((n) => PES[n].w * esc), gap = -26, tot = ws.reduce((a, b) => a + b, 0) + 2 * gap;
    let x = CX + 40 - tot / 2;
    NOMES.forEach((n, i) => {
      const k = P(t, T4[i], 0.8, 'mola'), h = PES[n].h * esc;
      busca.push(quadroPes(n, tclip(t - T4[i] + 1.4)));
      poePessoa(n, x, BASE + 40 - h + 260 * (1 - k), esc, Math.min(1, k * 2.5), 0);
      x += ws[i] + gap;
    });
  }
  $('ondas').innerHTML = ondas;

  // ===== C5 · círculo branco abre a partir do coração e revela o logo animado =====
  if (vis($('c5'), t >= INTRO - 0.35)) {
    $('c5').style.clipPath = `circle(${V(t, INTRO - 0.35, 0.7, 0, 1900, 'inOut')}px at ${icx}px ${icy}px)`;
    busca.push(busca1($('v5'), Math.max(0, t - INTRO)));
  }
  await Promise.all(busca);
};
</script>
