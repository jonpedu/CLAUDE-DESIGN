<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<!-- Teleorientação (Serviços do NTS, piloto) · v1 · 9:16
     Render: node ferramentas/animar.mjs <esta página> <saida.mp4>   ·   provas: FOTOS="t1,t2" node ferramentas/animar.mjs <página> <pasta>
     Fio condutor: a NOTIFICAÇÃO do celular. Ela chega (C1), vira o título (C1→C2, metamorfose), fica como cabeçalho
     (continuidade em C2 e C3) e volta como cartão grande no fecho (C4), que abre num círculo para o logo animado. -->
<script src="../camadas/mapa_br.js"></script>
<style>
  .cena { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: hidden; }
  /* fundo vivo: manchas diluídas (azul do núcleo + verde secundário) e pontos leves nas bordas */
  #fundo { position: absolute; inset: 0; background: #fff; overflow: hidden; }
  .mancha { position: absolute; width: 900px; height: 900px; border-radius: 50%; filter: blur(90px); }
  #fundo::after { content: ''; position: absolute; inset: -60px; background-image: radial-gradient(rgba(54,93,204,.16) 2.4px, transparent 3px);
    background-size: 48px 48px; -webkit-mask-image: radial-gradient(ellipse at 50% 45%, transparent 38%, #000 82%); mask-image: radial-gradient(ellipse at 50% 45%, transparent 38%, #000 82%);
    transform: translate(var(--dx, 0px), var(--dy, 0px)); }
  /* celular (desenhado; nada de marca nele) */
  #fone { position: absolute; left: 0; top: 0; width: 400px; height: 720px; border-radius: 64px; background: #1C306A;
    box-shadow: 0 40px 80px rgba(28,48,106,.28), inset 0 0 0 4px #2A4385; transform-origin: 200px 360px; z-index: 3; }
  #tela { position: absolute; left: 18px; top: 18px; width: 364px; height: 684px; border-radius: 48px; overflow: hidden;
    background: linear-gradient(160deg, #DCE6FB 0%, #B9CCF5 45%, #9FD7CF 100%); }
  #tela .ilha { position: absolute; left: 132px; top: 16px; width: 100px; height: 28px; border-radius: 14px; background: #1C306A; z-index: 5; }
  #feed { position: absolute; left: 0; top: 0; width: 364px; }
  #feed video { display: block; width: 364px; height: 684px; object-fit: cover; }
  .acoes { position: absolute; right: 14px; bottom: 120px; display: flex; flex-direction: column; gap: 22px; z-index: 4; }
  .acoes svg { width: 44px; height: 44px; filter: drop-shadow(0 2px 4px rgba(0,0,0,.35)); }
  /* notificação → título → cabeçalho → cartão final (um só elemento que muda de tamanho) */
  #card { position: absolute; left: 0; top: 0; z-index: 7; border-radius: 28px; background: #fff; display: flex; align-items: center;
    box-shadow: 0 18px 40px rgba(28,48,106,.18); overflow: hidden; }
  #card-ic { flex: none; border-radius: 50%; display: grid; place-items: center; background: #E8F5F3; }
  #card-ic svg { width: 58%; height: 58%; }
  #card-linhas { display: flex; flex-direction: column; gap: 12px; }
  #card-linhas i { display: block; height: 14px; border-radius: 7px; background: #D6DDEC; }
  #card-tit { position: absolute; font-weight: 800; white-space: nowrap; letter-spacing: -1px; }
  /* etiquetas retangulares (cantos levemente arredondados) */
  .etq { position: absolute; left: 0; top: 0; display: inline-flex; align-items: center; gap: 18px; white-space: nowrap;
    background: #fff; color: #1C306A; font-weight: 700; font-size: 54px; line-height: 1.1; padding: 16px 32px; border-radius: 16px;
    box-shadow: 0 12px 30px rgba(28,48,106,.16); transform-origin: 50% 50%; z-index: 5; }
  .etq.solida { background: #365DCC; color: #fff; }
  .item { position: absolute; left: 0; top: 0; width: 400px; display: flex; align-items: center; gap: 20px; background: #fff;
    border-radius: 22px; padding: 18px 22px; box-shadow: 0 14px 34px rgba(28,48,106,.16); transform-origin: 0 50%; z-index: 5; }
  .item .ic { flex: none; width: 76px; height: 76px; border-radius: 18px; display: grid; place-items: center; }
  .item .ic svg { width: 52px; height: 52px; }
  .item .tx { font-weight: 700; font-size: 42px; line-height: 1.08; color: #1C306A; }
  .pessoa { position: absolute; left: 0; top: 0; transform-origin: 50% 100%; z-index: 4; }
  #mapa { position: absolute; left: 0; top: 0; z-index: 1; overflow: visible; }
  #painel { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; z-index: 6;
    background: radial-gradient(circle at 50% 46%, #3D66D6 0%, #29479B 50%, #1C306A 100%); }
  #painel::before { content: ''; position: absolute; inset: -80px; background-image: radial-gradient(rgba(255,255,255,.10) 2.2px, transparent 2.8px);
    background-size: 46px 46px; -webkit-mask-image: radial-gradient(ellipse at 50% 45%, transparent 18%, #000 75%); mask-image: radial-gradient(ellipse at 50% 45%, transparent 18%, #000 75%);
    transform: translate(var(--dx, 0px), var(--dy, 0px)); }
  .regua-base { position: absolute; left: 0; bottom: 0; width: 1080px; z-index: 50; }
  .meio { position: absolute; left: 0; width: 960px; text-align: center; white-space: nowrap; }
</style></head>
<body>

<div id="fundo"><div class="mancha" id="b1" style="background:rgba(54,93,204,.11)"></div><div class="mancha" id="b2" style="background:rgba(25,117,111,.09)"></div><div class="mancha" id="b3" style="background:rgba(54,93,204,.07)"></div></div>

<!-- ondas que saem da notificação -->
<svg id="ondas" style="position:absolute;left:0;top:0;z-index:6;pointer-events:none" width="1080" height="1920" viewBox="0 0 1080 1920"></svg>

<!-- C2 · mapa + pessoas + etiquetas (sai arrastado para a esquerda em C3) -->
<div id="c2" class="cena" style="z-index:2">
  <svg id="mapa" width="1080" height="1920" viewBox="0 0 1080 1920"><g id="mapa-g"></g></svg>
  <img class="pessoa" id="p-idosa"><img class="pessoa" id="p-agricultor"><img class="pessoa" id="p-estudante">
  <span class="etq" id="t-consc">conscientização</span>

<div id="fone"><div id="tela"><div class="ilha"></div>
  <div id="feed">
    <video id="f0" muted preload="auto" src="trechos/01-dengue.mp4"></video>
    <video id="f1" muted preload="auto" src="trechos/04-hipertensao.mp4"></video>
    <video id="f2" muted preload="auto" src="trechos/02-obesidade.mp4"></video>

  </div>
  <div class="acoes" id="acoes">
    <svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.7 4.5c2.1 0 3.6 1.2 4.3 2.6.7-1.4 2.2-2.6 4.3-2.6 3.7 0 5.8 3.9 4.3 7.3C19.5 16.4 12 21 12 21Z" fill="#fff"/></svg>
    <svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4Z" fill="#fff"/></svg>
    <svg viewBox="0 0 24 24"><path d="M3 11 21 3l-6 18-3-7Z" fill="#fff"/></svg>
  </div>
</div></div>

<!-- C1 · gancho -->
<div class="meio" id="c1-txt" style="top:292px;z-index:5">
  <div id="c1-a" style="font-weight:600;font-size:64px;color:#475467;line-height:1.15">dica de saúde</div>
  <div id="c1-b" style="font-weight:800;font-size:104px;color:#365DCC;line-height:1.05;letter-spacing:-1px">no celular?</div>
</div>

<!-- C3 · texto e itens -->
<div class="meio" id="c3-a" style="top:428px;z-index:5;font-weight:600;font-size:50px;color:#1C306A">
  <span id="c3-a1" style="display:inline-block"><b style="color:#365DCC">informações</b> e</span>
  <span id="c3-a2" style="display:inline-block"><b style="color:#365DCC">orientações</b></span></div>
<div class="item" id="i0"><span class="ic" style="background:#E8F5F3"><svg viewBox="0 0 48 48"><path d="M10 38C10 18 22 8 40 8c0 18-10 30-30 30Z" fill="#19756F"/><path d="M10 38 30 18" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/></svg></span><span class="tx">bem-estar</span></div>
<div class="item" id="i1"><span class="ic" style="background:#E3E8F8"><svg viewBox="0 0 48 48"><path d="M24 41s-15-9-18-18C4 16 8 9 15 9c4 0 7 2 9 5 2-3 5-5 9-5 7 0 11 7 9 14-3 9-18 18-18 18Z" fill="#365DCC"/><path d="M14 25h6l3-6 4 11 3-5h5" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="tx">cuidados<br>em saúde</span></div>
<div class="item" id="i2"><span class="ic" style="background:#E3E8F8"><svg viewBox="0 0 48 48"><path d="M24 4 40 10v12c0 11-7 19-16 22C15 41 8 33 8 22V10Z" fill="#1C306A"/><path d="m16 24 6 6 11-12" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="tx">prevenção<br>de doenças</span></div>

<!-- C4 · painel azul do fecho -->
<div id="painel"></div>

<!-- cartão: notificação → título → cabeçalho → cartão final -->
<div id="card"><div id="card-ic"><svg viewBox="0 0 48 48"><path d="M24 41s-15-9-18-18C4 16 8 9 15 9c4 0 7 2 9 5 2-3 5-5 9-5 7 0 11 7 9 14-3 9-18 18-18 18Z" fill="#E5484D"/></svg></div>
  <div id="card-linhas"><i style="width:170px"></i><i style="width:120px"></i></div>
  <div id="card-tit">Teleorientação</div></div>

<!-- C5 · fechamento: vídeo da equipe, sem alteração; abre num círculo a partir do coração -->
<div class="cena" id="c5" style="z-index:9;background:#fff">
  <video id="v5" muted preload="auto" src="../../../elementos/Intro Telessaude.mp4" style="position:absolute;left:0;top:0;width:1080px"></video>
</div>

<img class="regua-base" src="../../../elementos/regua - tele-sted-sus-govbr.svg">

<script>
const $ = (id) => document.getElementById(id);
const P = TS.p, V = TS.v;
const vis = (el, on) => { TS.mostra(el, on); return on; };
const INTRO = 20.45;                 // início do logo animado (narração termina em 20,40 s)
window.DURACAO = INTRO + 4.395;      // 24,85 s
const mix = (a, b, k) => a + (b - a) * k;

// ---------- mapa (estados do SVG do usuário; Maranhão = BR-MA) ----------
const NS = 'http://www.w3.org/2000/svg';
MAPA.paths.forEach(({ id, d }) => { const p = document.createElementNS(NS, 'path'); p.setAttribute('d', d); p.id = 'm-' + id;
  p.setAttribute('fill', '#E3E8F8'); p.setAttribute('stroke', '#fff'); p.setAttribute('stroke-width', '1.2'); p.setAttribute('stroke-linejoin', 'round'); $('mapa-g').appendChild(p); });
const MA = $('m-BR-MA').getBBox();   // caixa do Maranhão (coordenadas do SVG original)

// ---------- pessoas: sequências PNG recortadas dos clipes do Flow (30 fps, 118 quadros) ----------
const PES = { idosa: { w: 368, h: 943, t0: 5.70 }, agricultor: { w: 456, h: 927, t0: 6.30 }, estudante: { w: 293, h: 866, t0: 6.95 } };
const pad = (n) => String(n).padStart(3, '0');
async function quadroPessoa(nome, i) {
  const el = $('p-' + nome), src = `../camadas/clipes/${nome}/${pad(i)}.png`;
  if (el._src === src) return; el._src = src; el.src = src; try { await el.decode(); } catch (e) {}
}

// ---------- caixa do cartão em cada estado: [cx, cy, w, h, raio, ícone, tamanho do título, cor do fundo 0=branco 1=azul] ----------
const CX = 480;   // centro da área segura (x 65–888)
const FONE_C1 = { cx: CX, cy: 900, s: 1.12 };
const NOTIF = [540, 900 - 360 * 1.12 + 150, 340, 116, 28, 72, 0, 0];
const TITULO = [CX, 720, 600, 200, 40, 124, 72, 1];
const CABEC = [CX, 345, 300, 116, 30, 78, 52, 1];
const FINAL = [CX, 860, 600, 230, 48, 140, 76, 0];
function poeCard(c, mostraLinhas) {
  let [cx, cy, w, h, r, ic, ft, azul] = c; const el = $('card');
  // a largura acompanha o título (nunca corta o texto)
  const tt0 = $('card-tit'); tt0.style.fontSize = `${Math.max(1, ft)}px`;
  if (ft > 20) { const p0 = Math.max(18, (h - ic) / 2); w = Math.max(w, p0 + ic + 0.18 * ft + 10 + tt0.offsetWidth + p0 + 6); }
  Object.assign(el.style, { left: `${cx - w / 2}px`, top: `${cy - h / 2}px`, width: `${w}px`, height: `${h}px`, borderRadius: `${r}px` });
  el.style.background = `rgb(${mix(255, 54, azul)},${mix(255, 93, azul)},${mix(255, 204, azul)})`;
  const pad = Math.max(18, (h - ic) / 2);
  Object.assign($('card-ic').style, { width: `${ic}px`, height: `${ic}px`, marginLeft: `${pad}px` });
  $('card-ic').style.background = azul > .5 ? 'rgba(255,255,255,.95)' : '#FDECEC';
  $('card-linhas').style.marginLeft = '22px'; $('card-linhas').style.opacity = mostraLinhas;
  const tt = $('card-tit'); tt.style.fontSize = `${Math.max(1, ft)}px`;
  tt.style.color = azul > .5 ? '#fff' : '#1C306A';
  tt.style.left = `${pad + ic + 0.18 * ft + 10}px`; tt.style.top = `${h / 2}px`; tt.style.transform = 'translateY(-54%)';
  return { cx, cy, w, h, ic, pad };
}
const mixC = (a, b, k) => a.map((v, i) => mix(v, b[i], k));

// ---------- feed do celular (C3): troca para cima, como Reels ----------
const FEED_T = [9.55, 10.85, 12.15, 13.20, 14.62, 15.85];   // o trecho 2 entra com "bem-estar", 3 com "cuidados", 4 com "prevenção"
const ITENS_T = [12.20, 13.24, 14.68];

window.render = async (t) => {
  const busca = [];
  document.documentElement.style.setProperty('--dx', `${(t * 9) % 48}px`);
  document.documentElement.style.setProperty('--dy', `${(t * 5) % 48}px`);
  // fundo vivo: manchas que derivam devagar
  [[$('b1'), 120, 260, 0.21, 0], [$('b2'), 640, 1040, 0.17, 2], [$('b3'), 320, 1460, 0.13, 4]].forEach(([el, x, y, f, ph]) => {
    el.style.left = `${x - 450 + 120 * Math.sin(f * t + ph)}px`; el.style.top = `${y - 450 + 90 * Math.cos(f * 0.8 * t + ph)}px`; });
  let ondas = '';

  // ===== C1 · celular + notificação (0–3,6 s) =====
  const fone = $('fone');
  const kIn = P(t, 0.0, 0.9, 'mola');
  const kSai1 = P(t, 3.0, 0.55, 'inOut');                      // celular recua quando a notificação vira título
  const kVolta = P(t, 8.85, 0.85, 'mola');                      // volta em C3, arrastado da direita
  const kLado = P(t, ITENS_T[0] - 0.15, 0.8, 'mola');           // abre espaço para os itens
  let fx, fy, fs, fo, fb = 0;
  if (t < 8.8) {
    fx = FONE_C1.cx; fy = FONE_C1.cy + 340 * (1 - kIn); fs = FONE_C1.s * (0.92 + 0.08 * kIn) * (1 - 0.25 * kSai1);
    fo = Math.min(1, t / 0.25) * (1 - kSai1); fb = 10 * kSai1;
  } else {
    fx = mix(CX + 1150, CX, kVolta); fy = 880; fs = 1.0; fo = 1;
    fx = mix(fx, 262, kLado); fs = mix(fs, 0.88, kLado); fy = mix(fy, 885, kLado);
  }
  // C4: o celular sobe junto com o painel e some atrás dele
  fone.style.transform = `translate(${fx - 200}px, ${fy - 360}px) scale(${fs})`;
  fone.style.opacity = fo; fone.style.filter = fb ? `blur(${fb}px)` : 'none';
  vis(fone, fo > 0.01 && t < 17.2);
  $('feed').style.display = t >= 8.8 ? '' : 'none'; $('acoes').style.opacity = t >= 8.8 ? 0.85 : 0;

  // texto do gancho: "dica de saúde" / "no celular?" (no tempo da fala), sai para cima
  const kTxtSai = P(t, 2.95, 0.45, 'inOut');
  TS.entra($('c1-a'), t, 0.86, { d: 0.5 }); TS.entra($('c1-b'), t, 1.95, { d: 0.5 });
  $('c1-txt').style.transform = `translateY(${-160 * kTxtSai}px)`; $('c1-txt').style.opacity = 1 - kTxtSai;
  vis($('c1-txt'), t < 3.5);

  // ===== cartão: notificação (0,8) → título (3,05) → cabeçalho (5,35) → cartão final (16,6) =====
  const kN = P(t, 0.80, 0.7, 'mola');                          // notificação desce dentro da tela
  const kT = P(t, 3.05, 0.95, 'mola');                         // metamorfose: notificação → título
  const kC = P(t, 5.30, 0.9, 'mola');                          // continuidade: título → cabeçalho
  const kF = P(t, 16.62, 1.0, 'mola');                         // cartão final do fecho
  let c = NOTIF.slice();
  // a notificação acompanha o celular enquanto ele recua
  c[1] = fy - 360 * fs + 150 * fs; c[0] = fx;
  c = mixC(c, TITULO, kT); c = mixC(c, CABEC, kC); c = mixC(c, FINAL, kF);
  const cb = poeCard(c, 1 - P(t, 3.05, 0.35));
  const op = Math.min(1, P(t, 0.80, 0.25)) * (t < 3.0 ? fo : 1);
  $('card').style.opacity = op;
  $('card').style.transform = `translateY(${-70 * (1 - kN)}px) scale(${0.85 + 0.15 * kN})`;
  // título aparece com a palavra "teleorientação" (3,88 s)
  const kTit = P(t, 3.62, 0.45);
  $('card-tit').style.opacity = kTit; $('card-tit').style.filter = `blur(${8 * (1 - kTit)}px)`;
  // coração: batida leve na chegada, na metamorfose e no fecho ("para você")
  const bat = (t0) => Math.max(0, Math.sin(Math.PI * Math.min(1, Math.max(0, (t - t0) / 0.32))));
  const bs = 1 + 0.16 * bat(0.95) + 0.12 * bat(3.88) + 0.12 * bat(17.0) + 0.14 * bat(18.16) + 0.14 * bat(19.64);
  $('card-ic').querySelector('svg').style.transform = `scale(${bs})`;
  // ondas da notificação (chegada) e do fecho
  const icx = cb.cx - cb.w / 2 + cb.pad + cb.ic / 2, icy = cb.cy;
  const onda = (t0, r0, cor) => { const f = (t - t0) / 1.1; if (f > 0 && f < 1) ondas += `<circle cx="${icx}" cy="${icy}" r="${r0 + 260 * f}" fill="none" stroke="${cor}" stroke-width="5" opacity="${0.55 * (1 - f)}"/>`; };
  onda(0.95, 30, '#365DCC'); onda(1.25, 30, '#365DCC'); onda(18.16, 80, '#ffffff'); onda(18.5, 80, '#ffffff');
  vis($('card'), t < INTRO + 0.7);

  // ===== C2 · mapa do Maranhão + pessoas + etiquetas (5,3–9,3 s) =====
  const kArr = P(t, 8.72, 0.6, 'inOut');                       // arrasto para a esquerda (C2 → C3)
  if (vis($('c2'), t >= 5.2 && t < 9.4)) {
    $('c2').style.transform = `translateX(${-1150 * kArr}px)`;
    // mapa: entra grande e aproxima no Maranhão, que acende no azul do núcleo
    const kM = P(t, 5.25, 0.5), kZ = P(t, 5.45, 1.3, 'mola'), kAz = P(t, 5.85, 0.5, 'inOut');
    const s0 = 1.45, s1 = 760 / MA.width;                       // Brasil inteiro → Maranhão com 760 px de largura
    const mcx = MA.x + MA.width / 2, mcy = MA.y + MA.height / 2;
    const s = mix(s0, s1, kZ), cx0 = 306, cy0 = 320;            // centro do Brasil no SVG original
    const ox = mix(cx0, mcx, kZ), oy = mix(cy0, mcy, kZ);
    $('mapa-g').setAttribute('transform', `translate(${CX} ${mix(900, 860, kZ)}) scale(${s}) translate(${-ox} ${-oy})`);
    $('mapa').style.opacity = kM;
    MAPA.paths.forEach(({ id }) => { const el = $('m-' + id);
      el.setAttribute('stroke-width', (1.2 / s * 1.6).toFixed(3));
      if (id === 'BR-MA') { const r = mix(227, 54, kAz), g = mix(232, 93, kAz), b = mix(248, 204, kAz); el.setAttribute('fill', `rgb(${r},${g},${b})`); }
      else el.setAttribute('fill', `rgba(227,232,248,${1 - 0.35 * kAz})`); });
    // pessoas: a primeira entra grande no centro; a cada nova, todas encolhem e abrem espaço (escala dinâmica)
    const nomes = ['idosa', 'agricultor', 'estudante'];
    const ks = nomes.map((n) => P(t, PES[n].t0, 0.85, 'mola'));
    const escN = [0.76, 0.66, 0.6];
    let esc = escN[0]; esc = mix(esc, escN[1], ks[1]); esc = mix(esc, escN[2], ks[2]);
    const larg = nomes.map((n, i) => PES[n].w * esc * Math.min(1, ks[i] * 1.0));
    const gap = -18 * esc, tot = larg.reduce((a, b) => a + b, 0) + gap * (ks.filter((k) => k > 0).length - 1);
    let x = CX - tot / 2;
    for (let i = 0; i < 3; i++) {
      const n = nomes[i], el = $('p-' + n), k = ks[i];
      busca.push(quadroPessoa(n, Math.min(117, Math.max(0, Math.round((t - PES[n].t0 + 0.15) * 30)))));
      const w = PES[n].w * esc, h = PES[n].h * esc;
      el.style.width = `${w}px`; el.style.height = `${h}px`;
      el.style.transform = `translate(${x + larg[i] / 2 - w / 2}px, ${1262 - h + 120 * (1 - k)}px)`;
      el.style.opacity = Math.min(1, k * 2.5); el.style.filter = k < 1 ? `blur(${6 * (1 - Math.min(1, k * 1.6))}px)` : 'none';
      x += larg[i] + (k > 0 ? gap : 0);
    }
    // etiquetas: "conscientização" (6,40) entra grande no centro; com "para o cidadão" (7,74) sobe e encolhe
    const k1 = P(t, 6.32, 0.7, 'mola'), k2 = P(t, 7.66, 0.7, 'mola');
    const e1 = $('t-consc'), e2 = $('t-cid');
    const w1 = e1.offsetWidth, h1 = e1.offsetHeight, w2 = e2.offsetWidth;
    const y1 = mix(560, 492, k2), s1e = mix(1.12, 0.94, k2), x1c = mix(CX, 360, k2);
    e1.style.transform = `translate(${x1c - w1 / 2}px, ${y1 - h1 / 2 + 50 * (1 - k1)}px) rotate(${-2 * k2}deg) scale(${s1e * (0.7 + 0.3 * k1)})`;
    e1.style.opacity = Math.min(1, k1 * 2);
    e2.style.transform = `translate(${mix(640, 600, k2) - w2 / 2}px, ${612 - h1 / 2 + 50 * (1 - k2)}px) rotate(${1.5 * k2}deg) scale(${0.7 + 0.3 * k2})`;
    e2.style.opacity = Math.min(1, k2 * 2);
  }

  // ===== C3 · feed + itens (8,8–16,7 s) =====
  if (t >= 8.8) {
    // trechos: cada um começa a tocar um pouco antes de aparecer; troca rolando para cima
    let pos = 0;
    FEED_T.forEach((ti, i) => { if (i > 0) pos += P(t, ti - 0.18, 0.36, 'inOut'); });
    $('feed').style.transform = `translateY(${-684 * pos}px)`;
    FEED_T.forEach((ti, i) => {
      const vis = Math.abs(i - pos) < 1;
      if (vis) busca.push(TS.busca($('f' + i), Math.min(1.5, Math.max(0, t - (i === 0 ? 8.85 : ti - 0.2)))));
    });
  }
  // texto "informações e orientações" (palavras 9,58 e 10,60)
  if (vis($('c3-a'), t >= 9.0 && t < 17.2)) {
    TS.entra($('c3-a1'), t, 9.5, { d: 0.45 }); TS.entra($('c3-a2'), t, 10.52, { d: 0.45 });
    const kU = P(t, ITENS_T[0] - 0.15, 0.8, 'mola');
    $('c3-a').style.transform = `translateY(${-8 * kU}px)`;
  }
  // itens: o novo entra grande e o conjunto se reorganiza (lista que cresce sobe junto)
  const kI = ITENS_T.map((ti) => P(t, ti - 0.12, 0.75, 'mola'));
  const nI = kI.reduce((a, b) => a + b, 0);
  for (let i = 0; i < 3; i++) {
    const el = $('i' + i), k = kI[i];
    if (!vis(el, k > 0 && t < 17.2)) continue;
    const yFinal = 885 + (i - (Math.max(1, nI) - 1) / 2) * 200;                // centralizado na altura do celular
    const novo = 1 - (i + 1 < 3 ? kI[i + 1] : 0);                             // o mais recente fica um pouco maior
    const s = 0.94 + 0.12 * novo;
    el.style.transform = `translate(${mix(490 + 120, 470, k)}px, ${yFinal - el.offsetHeight / 2}px) scale(${s})`;
    el.style.opacity = Math.min(1, k * 2.2); el.style.filter = k < 1 ? `blur(${8 * (1 - Math.min(1, k * 1.5))}px)` : 'none';
  }

  // ===== C4 · painel azul sobe; o cabeçalho vira o cartão final (16,45–20,45 s) =====
  const kP = P(t, 16.42, 0.62, 'inOut');
  vis($('painel'), kP > 0);
  $('painel').style.transform = `translateY(${1920 * (1 - kP)}px)`;
  $('ondas').innerHTML = ondas;

  // ===== C5 · círculo branco abre a partir do coração e revela o logo animado =====
  if (vis($('c5'), t >= INTRO - 0.35)) {
    $('c5').style.clipPath = `circle(${V(t, INTRO - 0.35, 0.7, 0, 1250, 'inOut')}px at ${icx}px ${icy}px)`;
    busca.push(TS.busca($('v5'), Math.max(0, t - INTRO)));
  }
  await Promise.all(busca);
};
</script>
